 lucro pelo custo. Lucro sobre a venda: Divide o lucro pelo preço de venda."}, {"id": 54, "a": ["Rentabilidade bruta", "Rentabilidade líquida"], "c": 0, "q": "É apurada antes de impostos e custos", "e": "Rentabilidade bruta: É apurada antes de impostos e custos. Rentabilidade líquida: É apurada depois de impostos e custos."}, {"id": 55, "a": ["Rentabilidade bruta", "Rentabilidade líquida"], "c": 1, "q": "É apurada depois de impostos e custos", "e": "Rentabilidade bruta: É apurada antes de impostos e custos. Rentabilidade líquida: É apurada depois de impostos e custos."}, {"id": 56, "a": ["Rentabilidade positiva", "Rentabilidade negativa"], "c": 0, "q": "Representa ganho financeiro", "e": "Rentabilidade positiva: Representa ganho financeiro. Rentabilidade negativa: Representa perda financeira."}, {"id": 57, "a": ["Rentabilidade positiva", "Rentabilidade negativa"], "c": 1, "q": "Representa perda financeira", "e": "Rentabilidade positiva: Representa ganho financeiro. Rentabilidade negativa: Representa perda financeira."}, {"id": 58, "a": ["Inflação", "Deflação"], "c": 0, "q": "É o aumento generalizado dos preços", "e": "Inflação: É o aumento generalizado dos preços. Deflação: É a redução generalizada dos preços."}, {"id": 59, "a": ["Inflação", "Deflação"], "c": 1, "q": "É a redução generalizada dos preços", "e": "Inflação: É o aumento generalizado dos preços. Deflação: É a redução generalizada dos preços."}];const key='moreira-batalha-v1';let s={order:[],pos:0,answers:{},sound:true,review:false};try{let t=JSON.parse(localStorage.getItem(key));if(t&&Array.isArray(t.order)&&t.order.every(i=>Q[i]))s=t}catch(e){}const app=document.querySelector('#app');function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(ids,review=false){s={order:shuffle(ids),pos:0,answers:{},sound:s.sound,review};save();render()}function tone(ok){if(!s.sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?780:180;g.gain.value=.12;o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.stop(a.currentTime+.36);o.onended=()=>a.close()}catch(e){}}function choose(v){let id=s.order[s.pos];if(id in s.answers)return;s.answers[id]=v;tone(v===Q[id].c);save();render()}function next(){s.pos++;save();render()}function reset(){if(confirm('Reiniciar e apagar o progresso desta partida?'))start(Q.map(q=>q.id))}function render(){let done=Object.keys(s.answers).length,good=Object.entries(s.answers).filter(([id,v])=>Q[id].c===v).length,miss=Object.keys(s.answers).filter(id=>Q[id].c!==s.answers[id]).map(Number);if(!s.order.length){app.innerHTML=`<section><h2>VOCÊ DOMINA OS CONCEITOS?</h2><p>60 desafios • 30 pares • Duas alternativas</p><p>Escolha o conceito correspondente à definição.</p><button onclick="start(Q.map(q=>q.id))">INICIAR BATALHA</button></section>`;return}if(s.pos>=s.order.length){app.innerHTML=`<section><h2>RESULTADO FINAL</h2><h1>${Math.round(good/s.order.length*100)}%</h1><p>Acertos: ${good} | Erros: ${miss.length}</p><div class="controls">${miss.length?'<button onclick="review()">REVISAR ERROS</button>':''}<button onclick="reset()">NOVA BATALHA</button></div></section>`;return}let q=Q[s.order[s.pos]],v=s.answers[q.id],answered=v!==undefined;let order=q.id%4<2?[0,1]:[1,0];app.innerHTML=`<section><small>${s.review?'REVISÃO':'DESAFIO'} ${s.pos+1} DE ${s.order.length} • ACERTOS: ${good} • ERROS: ${done-good}</small><div class="bar"><div style="width:${done/s.order.length*100}%"></div></div><h2>${q.q}.</h2><p>Qual é o conceito?</p><div class="opts">${order.map(i=>`<button ${answered?'disabled':''} class="${answered?(i===q.c?'good':i===v?'bad':''):''}" onclick="choose(${i})">${q.a[i]}</button>`).join('')}</div>${answered?`<p id="feedback" style="color:${v===q.c?'#86efac':'#ffaaaa'}">${v===q.c?'ACERTOU!':'ERROU!'}</p><p>${q.e}</p>${done%10===0?`<p>Placar do treinamento: ${good}/${done}</p>`:''}<button onclick="next()">${s.pos===s.order.length-1?'VER RESULTADO':'PRÓXIMO DESAFIO →'}</button>`:'<p><small>Escolha uma alternativa</small></p>'}</section><div class="controls"><button onclick="s.sound=!s.sound;save();render()">Som: ${s.sound?'ligado':'desligado'}</button><button onclick="reset()">Reiniciar</button><button onclick="document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()">Tela cheia</button></div>`}function review(){start(Object.keys(s.answers).filter(id=>Q[id].c!==s.answers[id]).map(Number),true)}render();</script></html>
